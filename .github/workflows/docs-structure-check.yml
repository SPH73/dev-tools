name: Docs and Structure Check

on:
  push:
    branches: ["Main"]
    paths:
      - "README.md"
      - "REPO-STRUCTURE.md"
      - "Agent-Planning-Toolkit-Starter/**"
      - ".github/workflows/docs-structure-check.yml"
  pull_request:
    paths:
      - "README.md"
      - "REPO-STRUCTURE.md"
      - "Agent-Planning-Toolkit-Starter/**"
      - ".github/workflows/docs-structure-check.yml"
  workflow_dispatch:

concurrency:
  group: docs-structure-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required root files
        run: |
          set -euo pipefail
          test -f README.md
          test -f REPO-STRUCTURE.md
          test -f PROJECT-OVERVIEW.md
          test -f PORTFOLIO-EVIDENCE.md
          test -f AI-COLLABORATION.md
          test -f CHANGELOG.md
          test -f RELEASE-CHECKLIST.md

      - name: Verify toolkit required files
        run: |
          set -euo pipefail
          test -f Agent-Planning-Toolkit-Starter/README.md
          test -f Agent-Planning-Toolkit-Starter/CONTRIBUTING.md
          test -f Agent-Planning-Toolkit-Starter/ROADMAP.md
          test -f Agent-Planning-Toolkit-Starter/LICENSE
          test -f Agent-Planning-Toolkit-Starter/toolkit/goal.md
          test -f Agent-Planning-Toolkit-Starter/toolkit/spec.md
          test -f Agent-Planning-Toolkit-Starter/toolkit/intake.schema.json
          test -f Agent-Planning-Toolkit-Starter/toolkit/prompt-template.txt
          test -f Agent-Planning-Toolkit-Starter/toolkit/output-contract.md
          test -f Agent-Planning-Toolkit-Starter/examples/sample-intake.csv
          test -f Agent-Planning-Toolkit-Starter/playbooks/operator-playbook.md
          test -f Agent-Planning-Toolkit-Starter/docs/publish-in-dev-tools.md
          test -f Agent-Planning-Toolkit-Starter/docs/first-public-announcement.md
          test -f Agent-Planning-Toolkit-Starter/MISSION.md
          test -f Agent-Planning-Toolkit-Starter/SCALING-PRINCIPLE.md
          test -f Agent-Planning-Toolkit-Starter/marketing/README.md
          test -f Agent-Planning-Toolkit-Starter/marketing/channel-defaults.md
          test -f Agent-Planning-Toolkit-Starter/marketing/buyer-profiles.md
          test -f Agent-Planning-Toolkit-Starter/marketing/user-stories.md
          test -f Agent-Planning-Toolkit-Starter/marketing/expert-role-campaign-strategist.md
          test -f Agent-Planning-Toolkit-Starter/marketing/model-selection-guide.md
          test -f Agent-Planning-Toolkit-Starter/marketing/agent-prompt-template.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/non-coding-founders-30-day-campaign.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/non-coding-founders-linkedin-assets.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/campaign-iteration-log-template.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/4-week-content-calendar.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/youtube-short-script-template.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/linkedin-post-template.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/x-post-derivation-template.md
          test -f Agent-Planning-Toolkit-Starter/marketing/campaigns/worked-example-youtube-to-linkedin-to-x.md
          test -f Agent-Planning-Toolkit-Starter/evidence/README.md
          test -f Agent-Planning-Toolkit-Starter/evidence/case-study-template.md
          test -f Agent-Planning-Toolkit-Starter/evidence/buyer-profile-non-coding-commercially-savvy-founders.md
          test -f Agent-Planning-Toolkit-Starter/evidence/sample-case-study-idea-to-execution-plan.md
          test -f Agent-Planning-Toolkit-Starter/evidence/case-study-dev-tools-public-baseline.md
          test -f Agent-Planning-Toolkit-Starter/evidence/post-draft-case-study-dev-tools-public-baseline.md

      - name: Verify key README references
        run: |
          set -euo pipefail
          rg "REPO-STRUCTURE\.md" README.md
          rg "PROJECT-OVERVIEW\.md" README.md
          rg "PORTFOLIO-EVIDENCE\.md" README.md
          rg "\.github/SECURITY\.md" README.md
          rg "AI-COLLABORATION\.md" README.md
          rg "provenance/" README.md
          rg "docs/publish-in-dev-tools\.md" Agent-Planning-Toolkit-Starter/README.md
          rg "SCALING-PRINCIPLE\.md" Agent-Planning-Toolkit-Starter/README.md

      - name: Validate JSON schema files
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('node:fs').readFileSync('Agent-Planning-Toolkit-Starter/toolkit/intake.schema.json','utf8'))"

      - name: Validate sample intake header
        run: |
          set -euo pipefail
          rg "^project_name,repo_url,planning_type,role_lens,cicd_expertise,infra_expertise,decision_authority,primary_optimization,risk_posture,compliance_requirements,team_size,release_cadence,current_deploy_target,branch_strategy,current_pain_points,required_checks,environments,rollback_expectation,timeline_weeks,budget_band,definition_of_done,notes$" Agent-Planning-Toolkit-Starter/examples/sample-intake.csv
