name: CI - Table Formatter

on:
  push:
    branches: ["Main"]
    paths:
      - "Table-Formatter/**"
      - ".github/workflows/ci-table-formatter.yml"
  pull_request:
    paths:
      - "Table-Formatter/**"
      - ".github/workflows/ci-table-formatter.yml"
  workflow_dispatch:

concurrency:
  group: ci-table-formatter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    defaults:
      run:
        working-directory: Table-Formatter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run tests
        run: node --test test/

      - name: Validate package manifest
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json','utf8'))"

      - name: Verify package tarball contents
        run: npm pack --dry-run
